    {axis:"p", q:"肌の色みに近いのは？", a:[
      {t:"黄みよりで血色が明るい", s:"spring"},
      {t:"青みよりで明るくソフト", s:"summer"},
      {t:"黄みよりで深みがある", s:"autumn"},
      {t:"青みよりでコントラストが強い", s:"winter"}]},
    {axis:"p", q:"似合うアクセサリーは？", a:[
      {t:"明るいゴールド", s:"spring"},
      {t:"上品なシルバー・プラチナ", s:"summer"},
      {t:"マットなゴールド・古美色", s:"autumn"},
      {t:"輝くシルバー", s:"winter"}]},
    {axis:"p", q:"白を着るなら得意なのは？", a:[
      {t:"アイボリー・生成り", s:"spring"},
      {t:"ソフトなオフホワイト", s:"summer"},
      {t:"ベージュがかった生成り", s:"autumn"},
      {t:"くっきりした純白", s:"winter"}]},
    {axis:"p", q:"得意な色の印象は？", a:[
      {t:"明るくクリアなパステル", s:"spring"},
      {t:"柔らかいスモーキーカラー", s:"summer"},
      {t:"こっくり深いアースカラー", s:"autumn"},
      {t:"はっきりビビッド or モノトーン", s:"winter"}]},
    {axis:"p", q:"髪・瞳の印象は？", a:[
      {t:"明るめの茶色、瞳も明るい", s:"spring"},
      {t:"ソフトな黒〜こげ茶で優しい印象", s:"summer"},
      {t:"深みのある茶色でこっくり", s:"autumn"},
      {t:"真っ黒でコントラストが強い", s:"winter"}]}
  ];

  var STAPLES = [
    {id:"pants",   label:"きれいめパンツ（センタープレス）", w:5, q:"センタープレス パンツ"},
    {id:"wshirt",  label:"白シャツ／ブラウス",             w:5, q:"白シャツ"},
    {id:"knit",    label:"シンプルニット",                 w:4, q:"ニット"},
    {id:"jacket",  label:"テーラードジャケット",           w:4, q:"テーラードジャケット"},
    {id:"denim",   label:"デニム",                         w:4, q:"デニム"},
    {id:"onepiece",label:"きれいめワンピース",             w:3, q:"ワンピース きれいめ"},
    {id:"skirt",   label:"スカート",                       w:3, q:"スカート"},
    {id:"coat",    label:"きれいめコート",                 w:3, q:"コート きれいめ"}
  ];

  var state = { phase:"intro", qi:0, ans:[], owned:{} };
  var app = document.getElementById("app");

  function keyMax(obj, order){
    var best=order[0];
    for(var i=1;i<order.length;i++){ if(obj[order[i]]>obj[best]) best=order[i]; }
    return best;
  }
  function computeTypes(){
    var kc={S:0,W:0,N:0}, pc={spring:0,summer:0,autumn:0,winter:0};
    state.ans.forEach(function(s,i){ if(QUESTIONS[i].axis==="k") kc[s]++; else pc[s]++; });
    return { k:keyMax(kc,["S","W","N"]), p:keyMax(pc,["spring","summer","autumn","winter"]) };
  }

  function toast(msg){
    var el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show");
    setTimeout(function(){ el.classList.remove("show"); }, 1800);
  }

  function render(){
    if(state.phase==="intro") return renderIntro();
    if(state.phase==="quiz")  return renderQuiz();
    if(state.phase==="result")return renderResult();
    if(state.phase==="closet")return renderCloset();
    if(state.phase==="final") return renderFinal();
  }

  function renderIntro(){
    app.innerHTML =
      '<div class="card">'+
        '<p class="eyebrow">無料診断 ・ 10問 ・ 約1分</p>'+
        '<h1>診断して、終わりにしない。</h1>'+
        '<p class="lede">骨格 × パーソナルカラーを10問で診断。そのまま「あなたに似合って、いま持っていない“次の1着”」まで案内します。</p>'+
        '<button class="btn" id="start">診断をはじめる</button>'+
      '</div>';
    document.getElementById("start").onclick=function(){ ev('shindan_start'); state.phase="quiz"; state.qi=0; state.ans=[]; render(); };
  }

  function renderQuiz(){
    var i=state.qi, Q=QUESTIONS[i], pct=Math.round((i/QUESTIONS.length)*100);
    var axisLabel = Q.axis==="k" ? "骨格タイプ" : "パーソナルカラー";
    var opts = Q.a.map(function(o,idx){
      return '<button class="opt" data-s="'+o.s+'">'+o.t+'</button>';
    }).join("");
    app.innerHTML =
      '<div class="card">'+
        '<div class="prog"><span>'+(i+1)+' / '+QUESTIONS.length+'</span>'+
          '<span class="bar"><span class="fill" style="width:'+pct+'%"></span></span></div>'+
        '<div class="axis-tag">'+axisLabel+'</div>'+
        '<p class="qtext">'+Q.q+'</p>'+
        '<div class="opts">'+opts+'</div>'+
      '</div>';
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(btn){
      btn.onclick=function(){
        state.ans[i]=btn.getAttribute("data-s");
        if(i+1<QUESTIONS.length){ state.qi=i+1; render(); }
        else { state.phase="result"; render(); }
      };
    });
  }

  function renderResult(){
    var t=computeTypes(), K=KOKKAKU[t.k], P=PC[t.p];
    state.types=t;
    ev('shindan_complete', {kokkaku:K.name, pc:P.name});
    var sw=P.colors.map(function(c){ return '<span class="sw" style="background:'+c+'"></span>'; }).join("");
    app.innerHTML =
      '<div class="card">'+
        '<div style="text-align:center;"><span class="eyebrow">あなたの診断結果 ✨</span></div>'+
        '<div class="verdict"><div class="big">'+K.name+'<span class="x">×</span>'+P.name+'</div>'+
          '<div class="sub">'+K.tag+'</div></div>'+
        '<div class="split">'+
          '<div class="mini"><div class="k">骨格</div><h3>'+K.name+'</h3><p>得意：'+K.silh+'<br>素材：'+K.material+'</p></div>'+
          '<div class="mini"><div class="k">カラー</div><h3>'+P.name+'</h3><p>'+P.tag+'<br>白は'+P.white+'が◎</p>'+
            '<div class="swatches">'+sw+'</div></div>'+
        '</div>'+
        '<div class="foot-actions">'+
          '<button class="btn" id="toCloset">次へ：手持ちをチェック</button>'+
          '<button class="btn ghost" id="share">📲 結果を画像でシェア</button>'+
        '</div>'+
        '<div class="share-row">'+
          '<button class="sbtn line" data-ch="line">LINE</button>'+
          '<button class="sbtn x" data-ch="x">X</button>'+
          '<button class="sbtn" data-ch="save">画像を保存</button>'+
        '</div>'+
        '<p class="note">結果カードを保存して、ストーリーズやLINEでシェア → 友だちもそのまま診断できます。<br>※診断はあくまで目安です。最後は「好き」も大切に。</p>'+
      '</div>';
    document.getElementById("toCloset").onclick=function(){ state.phase="closet"; render(); };
    document.getElementById("share").onclick=function(){ doShare(K,P,"native"); };
    Array.prototype.forEach.call(app.querySelectorAll(".share-row .sbtn"), function(b){
      b.onclick=function(){ doShare(K,P,b.getAttribute("data-ch")); };
    });
  }

  function renderCloset(){
    ev('shindan_closet_view');
    var chips = STAPLES.map(function(s){
      var on = state.owned[s.id] ? "true":"false";
      return '<button class="chip" role="checkbox" aria-pressed="'+on+'" data-id="'+s.id+'">'+s.label+'</button>';
    }).join("");
    app.innerHTML =
      '<div class="card">'+
        '<p class="eyebrow">手持ちチェック</p>'+
        '<h1 style="font-size:1.4rem;">持っているものにチェック</h1>'+
        '<p class="lede">全部登録しなくてOK。持っている“土台アイテム”を選ぶだけ。足りない1着を見つけます。</p>'+
        '<div class="grid-chips">'+chips+'</div>'+
        '<div class="foot-actions"><button class="btn gold" id="toFinal">「次の1着」を見る</button></div>'+
      '</div>';
    Array.prototype.forEach.call(app.querySelectorAll(".chip"), function(btn){
      btn.onclick=function(){
        var id=btn.getAttribute("data-id");
        state.owned[id]=!state.owned[id];
        btn.setAttribute("aria-pressed", state.owned[id]?"true":"false");
      };
    });
    document.getElementById("toFinal").onclick=function(){ state.phase="final"; render(); };
  }

  function renderFinal(){
    var t=state.types||computeTypes(), K=KOKKAKU[t.k], P=PC[t.p];
    var missing = STAPLES.filter(function(s){ return !state.owned[s.id]; });
    var rec = null;
    missing.forEach(function(s){ if(!rec || s.w>rec.w) rec=s; });
    ev('shindan_recommend', {item: rec?rec.label:"complete", kokkaku:K.name, pc:P.name});

    var body;
    if(rec){
      var query = rec.q + " " + P.word;
      var rk = rakutenAff(query);
      var az = "https://www.amazon.co.jp/s?k="+encodeURIComponent(query);
      body =
        '<div class="rec">'+
          '<div class="k">あなたの次の1着</div>'+
          '<h2>'+rec.label+'</h2>'+
          '<p class="why">着回しの土台で、いま手持ちに無い1着。<b>'+K.hint+'</b>、色は'+P.name+'の<b>'+P.word+'</b>を選ぶと、骨格もカラーもハマります。</p>'+
          '<div class="color-row"><span>おすすめカラー</span>'+
            P.colors.slice(0,4).map(function(c){return '<span class="sw" style="background:'+c+'"></span>';}).join("")+'</div>'+
          '<div class="shop">'+
            '<a class="rk" href="'+rk+'" target="_blank" rel="noopener sponsored" data-shop="rakuten">楽天で探す</a>'+
            '<a href="'+az+'" target="_blank" rel="noopener" data-shop="amazon">Amazonで探す</a>'+
          '</div>'+
        '</div>'+
        '<p class="note">※ 楽天リンクからのご購入で当サイトに紹介料が入ることがあります（価格は変わりません）。</p>';
    } else {
      body =
        '<div class="rec">'+
          '<div class="k">土台はコンプリート</div>'+
          '<h2>基本は揃っています 🎉</h2>'+
          '<p class="why">土台アイテムは万全。次は'+P.name+'の差し色（'+P.word+'系）や小物で“似合う”を伸ばすフェーズです。</p>'+
        '</div>';
    }
    app.innerHTML =
      '<div class="card">'+
        '<p class="eyebrow" style="color:var(--gold);background:var(--gold-soft);">診断 → 処方</p>'+
        '<h1 style="font-size:1.35rem;">'+K.name+' × '+P.name+' のあなたへ</h1>'+
        body+
        '<div class="foot-actions">'+
          '<button class="btn ghost" id="restart">最初からやり直す</button>'+
        '</div>'+
      '</div>';
    Array.prototype.forEach.call(app.querySelectorAll(".shop a"), function(a){
      a.addEventListener("click", function(){ ev('shindan_shop_click', {shop:a.getAttribute("data-shop"), item: rec?rec.label:""}); });
    });
    document.getElementById("restart").onclick=function(){ state={phase:"intro",qi:0,ans:[],owned:{}}; render(); };
  }

  render();
})();
</script>
</body>
</html>
